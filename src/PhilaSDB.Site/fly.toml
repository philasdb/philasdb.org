# philasdb.org on Fly.io. Deploy from the repo root (the build context holds the shared libraries and data):
#   fly deploy . --config src/PhilaSDB.Site/fly.toml --dockerfile src/PhilaSDB.Site/Dockerfile
# CI does this on main; see .github/workflows/site.yml

app = "philasdb-site"
primary_region = "ewr"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend when idle: resuming keeps the rendered pages in memory and takes a few hundred ms
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
