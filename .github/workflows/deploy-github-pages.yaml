name: Deploy Github Pages

on:
  push:
    branches: ["main"]
    paths: ["src/philasdb.site/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+ and Install Dependencies
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"
          cache: true
          run-install: true

      - name: Build Website
        run: vp run build

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: "github-pages"
          path: "src/philasdb.site/dist/"
          retention-days: 1

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
